<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Clown heist mask">
  <!-- Original clown heist mask drawn in the genre's conventions, not traced
       from Overkill's artwork. Colours are the app's own palette.
       Designed at 16px first: pale face, blue brow wedges, red nose and red
       grin are the four marks that survive; everything else is secondary. -->
  <rect width="64" height="64" rx="12" fill="#141210"/>

  <!-- Face -->
  <path d="M32 5c13.5 0 22.5 8.5 22.5 22 0 15.5-9.5 31-22.5 31S9.5 42.5 9.5 27C9.5 13.5 18.5 5 32 5Z"
        fill="#f5f1ea"/>

  <!-- Blue face paint over the brows, angled inward. -->
  <path d="M13 19.5 29.5 24.5 27.5 30.5 12 24Z" fill="#3987e5"/>
  <path d="M51 19.5 34.5 24.5 36.5 30.5 52 24Z" fill="#3987e5"/>

  <!-- Eyes: small, so they read as eyes rather than empty sockets. -->
  <ellipse cx="23" cy="32.5" rx="4.2" ry="5" fill="#141210" transform="rotate(-14 23 32.5)"/>
  <ellipse cx="41" cy="32.5" rx="4.2" ry="5" fill="#141210" transform="rotate(14 41 32.5)"/>

  <!-- Red nose: the single strongest clown signal, and what stops the whole
       thing reading as a skull. -->
  <circle cx="32" cy="39" r="4.2" fill="#d03b3b"/>

  <!-- Grin. Kept chunky: a thin smile disappears entirely at 16px, and the
       tooth line is a small notch rather than a full band for the same reason. -->
  <path d="M18 43.5c5 11 23 11 28 0-2 14-26 14-28 0Z" fill="#d03b3b"/>
  <path d="M22.5 47c4 1.6 15 1.6 19 0-4 2.6-15 2.6-19 0Z" fill="#f5f1ea"/>
</svg>
